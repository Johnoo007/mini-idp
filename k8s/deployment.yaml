apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-idp
  namespace: mini-idp
  labels:
    app: mini-idp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-idp
  template:
    metadata:
      labels:
        app: mini-idp
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mini-idp
          image: mini-idp   # real image + tag come from kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # restart the container if it stops answering
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          # only send traffic once it is ready
          readinessProbe:
            httpGet:
              path: /broken
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
