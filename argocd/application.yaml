apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mini-idp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Johnoo007/mini-idp.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mini-idp
  syncPolicy:
    automated:
      prune: true      # delete what was removed from git
      selfHeal: true   # undo manual kubectl changes
    syncOptions:
      - CreateNamespace=true
