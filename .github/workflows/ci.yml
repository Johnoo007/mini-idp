name: ci

on:
  push:
    branches: [main]
    # manifest-only changes need no new image; Argo CD deploys them directly
    paths-ignore: ["k8s/**", "argocd/**", "**.md"]
  pull_request:

permissions:
  contents: read
  packages: write   # needed to push to GHCR

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false   # no go.sum yet (no dependencies)
      - run: go vet ./...
      - run: go test -race -v ./...

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # GHCR names must be lowercase (repo owner is Johnoo007)
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # build once and load into the local docker so Trivy can scan it
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}

      # fail the pipeline on HIGH/CRITICAL vulnerabilities
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (pinned to commit)
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # only push from main, never from pull requests
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 for servers, arm64 so it also runs on Apple-silicon kind clusters
      - name: Push image (amd64 + arm64)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: VERSION=${{ github.sha }}

  # GitOps: write the new image tag into k8s/kustomization.yaml.
  # Argo CD watches that file and rolls the cluster forward.
  update-manifest:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Bump image tag
        run: |
          sed -i "s/^\(\s*newTag:\).*/\1 ${GITHUB_SHA}/" k8s/kustomization.yaml
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: mini-idp ${GITHUB_SHA::7}" || echo "nothing to change"
          git push
